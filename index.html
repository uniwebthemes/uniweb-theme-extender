<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>App home</title>
    <meta name="shopify-api-key" content="9a629fc304f193d0c2e19b5dd4c7bbb0" />
    <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
    <script src="https://cdn.shopify.com/shopifycloud/polaris.js"></script>
</head>

<body>
    <s-app-nav>
        <s-link href="/" rel="home">Home</s-link>
        <s-link href="https://uniwebthemes.github.io/uniweb-theme-extender/templates">Templates</s-link>
        <s-link href="https://uniwebthemes.github.io/uniweb-theme-extender/settings">Settings</s-link>
    </s-app-nav>
    <s-page heading="Product catalog" inline-size="base">
        <s-section>
            <s-text>Manage your product catalog and inventory.</s-text>
        </s-section>
    </s-page>
    <s-page heading="Page Title">
        <s-button slot="primary-action" onclick="shopify.toast.show('Save')">Save</s-button>
        <s-button slot="secondary-actions" onclick="shopify.toast.show('Cancel')">Cancel</s-button>
        <s-link slot="breadcrumb-actions" href="/">Home</s-link>
    </s-page>
    <s-section heading="Welcome to Uniweb Theme Extender Pack">
        <s-paragraph>Your single theme extension pack with lots of features. Save atleast $1000 per month on
            apps</s-paragraph>
    </s-section>

    <s-box padding="base" background="subdued" border="base" borderRadius="base">
        <s-heading id="product-title">Product Title</s-heading>
        <s-button id="product--picker" variant="primary">Select Product</s-button>
    </s-box>
    <s-stack alignItems="center">
        <s-text>Learn more about <s-link href="https://shopify.dev/docs/api/shopify-app-remix/v3/guide-custom-apps"
                target="_blank">Ultimate Theme Extender</s-link>.</s-text>
    </s-stack>
    <script src="uniweb-app.js" defer></script>
</body>

</html>
